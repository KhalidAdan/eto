name = "eto-subscribe"
main = "index.ts"
compatibility_date = "2026-07-01"

routes = [
  { pattern = "eto.news/subscribe*", zone_name = "eto.news" }
]

# Secrets (set once, via dashboard or `wrangler secret put`):
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY  (the eto-press IAM key)
#   SUBSCRIBE_SECRET                          (random 32+ bytes, HMAC key)
