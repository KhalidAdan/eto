# eto — the masthead file
#
# This file is your editorial line. Every outlet eto reads is listed here,
# and the "side" label on each one is YOUR call, not eto's — eto only uses
# it to measure when a story's coverage has collapsed onto one side
# (NORTH-STAR §6). The seeds below are conventional placements to start
# from. Disagree with one? Change it. That is the point of the file.
#
# side: one of "left", "center", "right" (add your own labels if you want —
#       eto compares labels for balance, it does not interpret them)

[[source]]
name = "FOX News"
side = "right"
feeds = [
  "https://moxie.foxnews.com/google-publisher/politics.xml",
  "https://moxie.foxnews.com/google-publisher/world.xml",
]

