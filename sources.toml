# eto — the masthead file
#
# This file is your editorial line. Every outlet eto reads is listed here,
# and the "side" label on each one is YOUR call, not eto's — eto only uses
# it to measure when a story's coverage has collapsed onto one side
# (NORTH-STAR §6, and see "The Default Masthead").
#
# This roster was seeded 2026-07-25 from the AllSides Media Bias Chart
# v11.3 using its five labels: left, lean-left, center, lean-right, right.
# The full audited shelf — every chart outlet, feed URLs, open/closed
# status, paywall caveats — is docs/SOURCES.md. Disagree with a label?
# Change it. That is the point of the file.

# One model-nominated story per day from outside the front page, its
# reason printed for you to judge. Set false and it is gone (experiment 003).
below_the_fold = true

# Morning email delivery to the eto-readers list. Flip to true once the
# mail domain is verified and SES production access is granted.
email_edition = false

