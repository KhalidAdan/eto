<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- eto: lowercase Lora e, claret period. Transparent ground; the glyph
       flips ink/white with the browser theme. PNG fallback covers browsers
       that ignore SVG favicons. Assembled programmatically - do not hand-edit
       the payloads. -->
  <style>
    .dark { display: none; }
    @media (prefers-color-scheme: dark) {
      .light { display: none; }
      .dark { display: inline; }
    }
  </style>
  <image class="light" width="96" height="96" href="data:image/png;base64,"/>
  <image class="dark" width="96" height="96" href="data:image/png;base64,"/>
</svg>
