<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- eto: lowercase Lora e filling the canvas, claret period in the corner.
       Theme-adaptive via prefers-color-scheme. Assembled programmatically -
       do not hand-edit the payloads. -->
  <style>
    .dark { display: none; }
    @media (prefers-color-scheme: dark) {
      .light { display: none; }
      .dark { display: inline; }
    }
  </style>
  <image class="light" width="96" height="96" href="data:image/png;base64,"/>
  <image class="dark" width="96" height="96" href="data:image/png;base64,"/>
</svg>
