# Deploys the mail slot (workers/subscribe) when it changes. Requires the
# CLOUDFLARE_API_TOKEN secret to carry Workers Scripts: Edit and the
# eto.news zone's Workers Routes: Edit, alongside its Pages permission.
name: deploy-subscribe-worker

on:
  push:
    branches: [main]
    paths: ["workers/subscribe/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install worker dependencies
        working-directory: workers/subscribe
        run: npm install
      - name: Deploy worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/subscribe
          command: deploy
